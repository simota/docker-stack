[workspace]
resolver = "3"
members = ["crates/engine", "app"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "Apache-2.0"

[workspace.dependencies]
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "time", "sync"] }
# The UI toolkit, from crates.io.
noa-gpui-platform = { version = "0.1", features = ["native"] }
bollard = { version = "0.21", features = ["ssl"] }
tracing = "0.1"
sha2 = "0.10"
toml = "0.8"
base64 = "0.23"
libc = "0.2"
