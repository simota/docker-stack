name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: verify
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      # The UI toolkit (noa-gpui-platform) comes from crates.io; only this repository is
      # checked out, into docker-stack/.
      - uses: actions/checkout@v4
        with:
          path: docker-stack
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: docker-stack
      # The packages scripts/install.sh --deps installs with apt.
      - run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libxkbcommon0 libvulkan1 mesa-vulkan-drivers
      # The checks themselves live in scripts/verify.sh, the same command people and agents run.
      # #TODO(agent): UNVERIFIED — no pull request has run this workflow yet; confirm it on the first one.
      - run: ./scripts/verify.sh --full
        working-directory: docker-stack
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-output
          include-hidden-files: true
          path: docker-stack/.verify/
